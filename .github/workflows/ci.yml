name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint source and tests
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build the published library
        run: npm run build

      - name: Build the interactive demo
        run: npm run demo:build

      - name: Ensure committed distribution files are current
        run: git diff --exit-code -- dist
